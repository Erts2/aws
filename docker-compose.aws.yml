version: '3'
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_PASSWORD=postgres_password
  redis:
    image: 'redis:latest'
  nginx:
    depends_on:
      - api
      - client
    restart: always
    image: 'erts2/multi-nginx:latest'
    ports:
      - '80:80'
  api:
    image: 'erts2/multi-server:latest'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432
  client:
    image: 'erts2/multi-client:latest'
    environment:
      - WDS_SOCKET_PORT=0
  worker:
    image: 'erts2/multi-worker:latest'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

